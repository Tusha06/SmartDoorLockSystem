<!DOCTYPE html>
<html>
<head>
    <title>Door Lock System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0f0f0f; color: #fff; font-family: Arial; }
        .header { background: #1a1a2e; padding: 16px 24px;
                  display: flex; align-items: center; gap: 12px; }
        .header h1 { font-size: 20px; }
        .status-dot { width: 12px; height: 12px; border-radius: 50%;
                      background: #43a047; animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
        .container { padding: 20px; max-width: 900px; margin: 0 auto; }
        .cam-box { background: #1a1a2e; border-radius: 12px;
                   overflow: hidden; margin-bottom: 20px; }
        .cam-box img { width: 100%; display: block; }
        .cam-title { padding: 12px 16px; font-size: 14px;
                     color: #8899aa; border-bottom: 1px solid #2a3a5a; }
        .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .card { background: #1a1a2e; border-radius: 12px; padding: 20px; }
        .card-title { font-size: 12px; color: #8899aa; margin-bottom: 8px; }
        .card-value { font-size: 22px; font-weight: 500; }
        .locked   { color: #e53935; }
        .unlocked { color: #43a047; }
        .faces-list { margin-top: 8px; }
        .face-pill { display: inline-block; background: #0d2137;
                     border: 1px solid #1976d2; color: #64b5f6;
                     font-size: 12px; padding: 3px 10px;
                     border-radius: 20px; margin: 3px; }
    </style>
</head>
<body>
    <div class="header">
        <div class="status-dot"></div>
        <h1>Door Lock System</h1>
    </div>

    <div class="container">
        <div class="cam-box">
            <div class="cam-title">Live Camera — Face Detection</div>
            <img src="/video_feed">
        </div>

        <div class="cards">
            <div class="card">
                <div class="card-title">Door Status</div>
                <div class="card-value" id="door-status">Loading...</div>
            </div>
            <div class="card">
                <div class="card-title">Known Faces</div>
                <div class="faces-list" id="faces-list">Loading...</div>
            </div>
        </div>
    </div>

    <script>
        function updateStatus() {
            fetch('/get_status')
                .then(r => r.json())
                .then(data => {
                    const el = document.getElementById('door-status');
                    el.textContent = data.door_locked ? 'Locked' : 'Unlocked';
                    el.className = 'card-value ' + (data.door_locked ? 'locked' : 'unlocked');

                    const fl = document.getElementById('faces-list');
                    fl.innerHTML = data.known_faces.map(n =>
                        `<span class="face-pill">${n}</span>`).join('');
                });
        }
        setInterval(updateStatus, 2000);
        updateStatus();
    </script>
</body>
</html>
