<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Door Lock - Remote Access</title>
    <style>
        body {
            background-color: #0f0f13;
            color: #ffffff;
            font-family: 'Inter', 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(20px);
            text-align: center;
            width: 85%;
            max-width: 350px;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 40px;
            font-size: 22px;
            font-weight: 500;
            letter-spacing: 1px;
            color: #e0e0e0;
        }

        .lock-btn {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: none;
            outline: none;
            font-size: 20px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            position: relative;
        }

        .locked {
            background: linear-gradient(135deg, #e53935, #b71c1c);
            box-shadow: 0 10px 30px rgba(229, 57, 53, 0.4),
                inset 0 2px 5px rgba(255, 255, 255, 0.3);
        }

        .unlocked {
            background: linear-gradient(135deg, #43a047, #1b5e20);
            box-shadow: 0 10px 30px rgba(67, 160, 71, 0.4),
                inset 0 2px 5px rgba(255, 255, 255, 0.3);
        }

        .lock-btn:active {
            transform: scale(0.9);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
        }

        .status-text {
            margin-top: 35px;
            font-size: 15px;
            color: #888;
            letter-spacing: 0.5px;
        }

        .icon {
            font-size: 50px;
            margin-bottom: 15px;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
        }

        /* Pulse Animation when checking status */
        @keyframes pulse {
            0% {
                opacity: 0.6;
            }

            50% {
                opacity: 1;
            }

            100% {
                opacity: 0.6;
            }
        }

        .loading {
            animation: pulse 1.5s infinite;
        }
    </style>
</head>

<body>
    <div class="glass-panel">
        <h1>REMOTE DOOR ACCESS</h1>

        <button id="lockBtn" class="lock-btn locked" onclick="toggleLock()">
            <div id="btnIcon" class="icon">🔒</div>
            <div id="btnText">LOCKED</div>
        </button>

        <div class="status-text" id="statusText">Connecting to door...</div>
    </div>

    <script>
        // Blynk Credentials
        const BLYNK_AUTH_TOKEN = "jaom-iUT1r94Dv-_6AT0mc5awAAfG_vS";
        const PIN = "V1"; // Virtual Pin used for the door lock in your ESP32 code

        let isLocked = true; // Default state assumed
        let isUpdating = false;

        async function fetchStatus() {
            if (isUpdating) return;

            try {
                // Blynk HTTP API to get datastream value
                const response = await fetch(`https://blynk.cloud/external/api/get?token=${BLYNK_AUTH_TOKEN}&${PIN}`);
                const data = await response.text();

                // Note: Change the condition below based on how your ESP32 code works
                // Usually 1 = Locked (ON), 0 = Unlocked (OFF)
                isLocked = (data.trim() === "1");
                updateUI();
            } catch (error) {
                document.getElementById("statusText").innerText = "Connection failed. Retrying...";
                console.error("Fetch error:", error);
            }
        }

        async function toggleLock() {
            if (isUpdating) return;
            isUpdating = true;

            // Toggle the state
            isLocked = !isLocked;
            const newValue = isLocked ? 1 : 0;

            // Update UI instantly for responsiveness
            updateUI();
            document.getElementById("statusText").innerText = "Sending command...";
            document.getElementById("lockBtn").classList.add("loading");

            try {
                // Blynk HTTP API to update datastream value
                await fetch(`https://blynk.cloud/external/api/update?token=${BLYNK_AUTH_TOKEN}&${PIN}=${newValue}`);

                document.getElementById("statusText").innerText = isLocked ? "Door is securely locked" : "Door is unlocked";
            } catch (error) {
                document.getElementById("statusText").innerText = "Failed to send command";
                // Revert state if failed
                isLocked = !isLocked;
                updateUI();
            } finally {
                isUpdating = false;
                document.getElementById("lockBtn").classList.remove("loading");
            }
        }

        function updateUI() {
            const btn = document.getElementById("lockBtn");
            const btnIcon = document.getElementById("btnIcon");
            const btnText = document.getElementById("btnText");
            const statusText = document.getElementById("statusText");

            if (isLocked) {
                btn.className = "lock-btn locked";
                btnIcon.innerText = "🔒";
                btnText.innerText = "LOCKED";
                if (!isUpdating) statusText.innerText = "Door is securely locked";
            } else {
                btn.className = "lock-btn unlocked";
                btnIcon.innerText = "🔓";
                btnText.innerText = "UNLOCKED";
                if (!isUpdating) statusText.innerText = "Door is unlocked";
            }
        }

        // Fetch status initially
        fetchStatus();

        // Check door status every 3 seconds to keep UI synced if someone else operates from Blynk App
        setInterval(fetchStatus, 3000);
    </script>
</body>

</html>
