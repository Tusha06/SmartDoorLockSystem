<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0b10">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Smart Door Lock • Remote Access</title>
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-base: #08090d;
            --surface-glass: rgba(22, 25, 35, 0.65);
            --border-glass: rgba(255, 255, 255, 0.08);
            --locked-primary: #ef4444;
            --locked-glow: rgba(239, 68, 68, 0.35);
            --unlocked-primary: #10b981;
            --unlocked-glow: rgba(16, 185, 129, 0.35);
            --text-primary: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #3b82f6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(59, 130, 246, 0.12) 0%, transparent 60%),
                radial-gradient(circle at 80% 100%, rgba(16, 185, 129, 0.08) 0%, transparent 40%);
            color: var(--text-primary);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 390px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Top Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 4px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .brand-title {
            font-size: 17px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .device-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            padding: 5px 12px;
            font-size: 12px;
            color: var(--text-muted);
            backdrop-filter: blur(8px);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #64748b;
            transition: all 0.3s ease;
        }

        .status-dot.online {
            background-color: #10b981;
            box-shadow: 0 0 8px #10b981;
            animation: pulse-dot 2s infinite;
        }

        .status-dot.offline {
            background-color: #f59e0b;
        }

        @keyframes pulse-dot {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.6; }
        }

        /* Main Glass Card */
        .card {
            background: var(--surface-glass);
            border: 1px solid var(--border-glass);
            border-radius: 28px;
            padding: 36px 24px 28px 24px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
        }

        /* Central Lock Button */
        .btn-wrapper {
            position: relative;
            margin: 20px 0;
        }

        .glow-ring {
            position: absolute;
            top: -12px;
            left: -12px;
            right: -12px;
            bottom: -12px;
            border-radius: 50%;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            filter: blur(16px);
            opacity: 0.6;
            z-index: 0;
        }

        .lock-btn {
            position: relative;
            z-index: 1;
            width: 190px;
            height: 190px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.1);
            outline: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.2), 0 15px 35px rgba(0, 0, 0, 0.4);
        }

        .lock-btn:active {
            transform: scale(0.93);
        }

        /* State Styles */
        .state-locked .lock-btn {
            background: linear-gradient(145deg, #ef4444, #b91c1c);
        }
        .state-locked .glow-ring {
            background: var(--locked-glow);
        }

        .state-unlocked .lock-btn {
            background: linear-gradient(145deg, #10b981, #047857);
        }
        .state-unlocked .glow-ring {
            background: var(--unlocked-glow);
        }

        .btn-icon {
            font-size: 52px;
            margin-bottom: 8px;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.3));
            transition: transform 0.3s ease;
        }

        .btn-label {
            font-size: 19px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .btn-sub {
            font-size: 11px;
            opacity: 0.8;
            font-weight: 400;
            margin-top: 2px;
            letter-spacing: 0.5px;
        }

        /* Status Description */
        .status-box {
            text-align: center;
            margin-top: 10px;
        }

        .status-heading {
            font-size: 16px;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .status-desc {
            font-size: 13px;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
        }

        /* Action Buttons */
        .actions-grid {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 24px;
        }

        .action-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            gap: 6px;
            color: var(--text-primary);
            font-family: inherit;
        }

        .action-card:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .action-card:active {
            transform: scale(0.96);
        }

        .action-card.full-width {
            grid-column: span 2;
        }

        .action-icon {
            font-size: 20px;
        }

        .action-text {
            font-size: 13px;
            font-weight: 500;
        }

        /* Spinner / Loading Animation */
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
        }

        /* Toast notification */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 13px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* Footer */
        .footer {
            text-align: center;
            font-size: 12px;
            color: #64748b;
            margin-top: 10px;
        }

        /* Responsive Layout for Desktop & Mobile */
        @media (min-width: 768px) {
            .container {
                max-width: 780px;
            }
            .dashboard-layout {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 20px;
                align-items: start;
            }
        }

        /* Intruder Alert Card */
        .alert-card {
            background: var(--surface-glass);
            border: 1px solid rgba(239, 68, 68, 0.35);
            border-left: 5px solid var(--locked-primary);
            border-radius: 24px;
            padding: 20px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 20px 40px rgba(239, 68, 68, 0.15), 0 10px 25px rgba(0, 0, 0, 0.5);
            display: none;
            flex-direction: column;
            gap: 12px;
            animation: slideDown 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .alert-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .alert-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .alert-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background-color: #ef4444;
            animation: pulse-dot 1.5s infinite;
        }

        .alert-time {
            font-size: 11px;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
        }

        .photo-wrapper {
            position: relative;
            width: 100%;
            height: 200px;
            border-radius: 16px;
            overflow: hidden;
            background: #0d1117;
            border: 1px solid rgba(255, 255, 255, 0.08);
            cursor: pointer;
        }

        .photo-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
        }

        .photo-wrapper:hover img {
            transform: scale(1.03);
        }

        .telegram-pill {
            position: absolute;
            bottom: 8px;
            left: 8px;
            right: 8px;
            background: rgba(10, 11, 16, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 6px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
        }

        .telegram-status {
            color: #60a5fa;
            font-weight: 500;
            display: flex;
            align-items: gap;
            gap: 5px;
        }

        .telegram-check {
            color: #34d399;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
        }

        .alert-actions {
            display: flex;
            gap: 8px;
            margin-top: 4px;
        }

        .btn-alert-unlock {
            flex: 1;
            padding: 10px;
            background: linear-gradient(135deg, #10b981, #059669);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .btn-alert-unlock:hover {
            filter: brightness(1.1);
        }

        .btn-alert-dismiss {
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: var(--text-muted);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-alert-dismiss:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
        }

        /* Modal Lightbox for Full-Size Photo */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            inset: 0;
            background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(12px);
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.open {
            display: flex;
        }

        .modal-content {
            max-width: 90vw;
            max-height: 85vh;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
            position: relative;
        }

        .modal-content img {
            max-width: 100%;
            max-height: 80vh;
            display: block;
        }

        .modal-close {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="brand">
                <div class="brand-icon">⚡</div>
                <div class="brand-title">Smart Lock</div>
            </div>
            <div class="device-badge" id="deviceBadge" title="ESP32 hardware status">
                <div class="status-dot" id="deviceDot"></div>
                <span id="deviceText">Checking...</span>
            </div>
        </header>

        <!-- Dashboard Layout (Responsive 2-col on desktop, stacked on mobile) -->
        <div class="dashboard-layout" id="dashboardLayout">
            <!-- Intruder / Unknown Person Alert Card -->
            <section class="alert-card" id="visitorAlertCard" aria-live="polite">
                <div class="alert-header">
                    <div class="alert-badge">
                        <div class="alert-dot"></div>
                        <span>VISITOR DETECTED</span>
                    </div>
                    <span class="alert-time" id="alertTimestamp">Just now</span>
                </div>

                <div class="photo-wrapper" onclick="openPhotoModal()" title="Click to view full photo">
                    <img id="intruderPhotoImg" src="" alt="Unknown Person Captured">
                    <div class="telegram-pill">
                        <span class="telegram-status">✈️ Telegram Alert</span>
                        <span class="telegram-check">Delivered ✓</span>
                    </div>
                </div>

                <div class="alert-actions">
                    <button class="btn-alert-unlock" onclick="autoUnlockFiveSeconds()">
                        <span>🔓</span> Quick Unlock 5s
                    </button>
                    <button class="btn-alert-dismiss" onclick="dismissPhotoAlert()">
                        Dismiss
                    </button>
                </div>
            </section>

            <!-- Main Controller Card -->
            <main class="card state-locked" id="cardContainer">
                <div class="btn-wrapper">
                    <div class="glow-ring"></div>
                    <button class="lock-btn" id="lockBtn" onclick="toggleLock()" aria-label="Toggle Door Lock">
                        <span class="btn-icon" id="btnIcon">🔒</span>
                        <span class="btn-label" id="btnText">LOCKED</span>
                        <span class="btn-sub" id="btnSub">Tap to unlock</span>
                    </button>
                </div>

                <div class="status-box">
                    <div class="status-heading" id="statusHeading">Door is Securely Locked</div>
                    <div class="status-desc" id="statusDesc">Last sync: --:--:--</div>
                </div>

                <!-- Action buttons -->
                <div class="actions-grid">
                    <button class="action-card full-width" onclick="autoUnlockFiveSeconds()">
                        <span class="action-icon">⏱️</span>
                        <span class="action-text" id="autoUnlockBtnText">Temporary 5s Auto-Unlock</span>
                    </button>
                    <button class="action-card" onclick="fetchStatus(true)">
                        <span class="action-icon">🔄</span>
                        <span class="action-text">Refresh Status</span>
                    </button>
                    <button class="action-card" onclick="testConnection()">
                        <span class="action-icon">📶</span>
                        <span class="action-text">Ping ESP32</span>
                    </button>
                    <button class="action-card full-width" style="opacity: 0.7; font-size: 12px; padding: 10px; margin-top: 4px;" onclick="simulateAlertDemo()">
                        <span class="action-icon">📸</span>
                        <span class="action-text">Test Visitor Alert Preview</span>
                    </button>
                </div>
            </main>
        </div>

        <footer class="footer">
            Blynk IoT Cloud • ESP32 Secure Control
        </footer>
    </div>

    <!-- Notification Toast -->
    <div class="toast" id="toast">Command sent successfully</div>

    <!-- Modal for Enlarged Intruder Photo -->
    <div class="modal" id="photoModal" onclick="closePhotoModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="closePhotoModal()" aria-label="Close photo">✕</button>
            <img id="modalImg" src="" alt="Enlarged Intruder Photo">
        </div>
    </div>

    <script>
        // Blynk Cloud Configuration
        const BLYNK_AUTH_TOKEN = "jaom-iUT1r94Dv-_6AT0mc5awAAfG_vS";
        const PIN              = "V1"; // Virtual Pin 1 (0 = Locked, 1 = Unlocked)
        const PHOTO_PIN        = "V2"; // Virtual Pin 2 (Alert Photo URL)

        let isLocked           = true;
        let isUpdating         = false;
        let countdownTimer     = null;
        let lastKnownPhoto     = null;
        let alertDismissedFor  = null;

        // Trigger light haptic vibration if supported on phone
        function vibratePhone(pattern = [30]) {
            if ("vibrate" in navigator) {
                try { navigator.vibrate(pattern); } catch (e) {}
            }
        }

        // Show toast notification
        function showToast(msg, icon = "✓") {
            const toast = document.getElementById("toast");
            toast.innerHTML = `<span>${icon}</span> <span>${msg}</span>`;
            toast.classList.add("show");
            setTimeout(() => toast.classList.remove("show"), 2500);
        }

        // Fetch current lock status from Blynk
        async function fetchStatus(isManual = false) {
            if (isUpdating) return;

            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 6000);

                const response = await fetch(`https://blynk.cloud/external/api/get?token=${BLYNK_AUTH_TOKEN}&${PIN}`, {
                    signal: controller.signal
                });
                clearTimeout(timeoutId);

                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const raw = (await response.text()).trim();
                const val = raw.replace(/[\[\]"']/g, '').trim();
                // 0 = Locked, 1 = Unlocked
                isLocked = (val === "0");
                updateUI();

                const now = new Date();
                document.getElementById("statusDesc").innerText = `Synced at ${now.toLocaleTimeString()}`;

                if (isManual) {
                    showToast("Status refreshed");
                    vibratePhone([20]);
                }
            } catch (error) {
                console.error("fetchStatus error:", error);
                document.getElementById("statusDesc").innerText = "Sync failed. Retrying...";
                if (isManual) showToast("Connection failed", "⚠️");
            }

            // Also check hardware connection status and photo alerts
            checkHardwareStatus();
            checkPhotoAlert();
        }

        // Check if ESP32 hardware is connected
        async function checkHardwareStatus() {
            try {
                const response = await fetch(`https://blynk.cloud/external/api/isHardwareConnected?token=${BLYNK_AUTH_TOKEN}`);
                if (response.ok) {
                    const isOnline = (await response.text()).trim() === "true";
                    const dot = document.getElementById("deviceDot");
                    const text = document.getElementById("deviceText");

                    if (isOnline) {
                        dot.className = "status-dot online";
                        text.innerText = "ESP32 Online";
                    } else {
                        dot.className = "status-dot offline";
                        text.innerText = "ESP32 Offline";
                    }
                }
            } catch (e) {
                console.warn("Hardware status check error:", e);
            }
        }

        // Toggle permanent lock state
        async function toggleLock() {
            if (isUpdating) return;
            vibratePhone([40]);

            isUpdating = true;
            const targetState = !isLocked;
            // 0 = Locked, 1 = Unlocked
            const newValue = targetState ? 0 : 1;

            const btnText = document.getElementById("btnText");
            const btnSub = document.getElementById("btnSub");
            const statusHeading = document.getElementById("statusHeading");

            btnSub.innerHTML = '<span class="spinner"></span> Transmitting...';
            statusHeading.innerText = targetState ? "Locking door..." : "Unlocking door...";

            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 7000);

                const response = await fetch(`https://blynk.cloud/external/api/update?token=${BLYNK_AUTH_TOKEN}&${PIN}=${newValue}`, {
                    signal: controller.signal
                });
                clearTimeout(timeoutId);

                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                isLocked = targetState;
                updateUI();
                vibratePhone([30, 50, 30]);
                showToast(isLocked ? "Door locked securely" : "Door unlocked successfully", isLocked ? "🔒" : "🔓");
            } catch (error) {
                console.error("toggleLock error:", error);
                showToast("Failed to send command. Check connection.", "⚠️");
                vibratePhone([80, 80]);
                updateUI();
            } finally {
                isUpdating = false;
            }
        }

        // Auto-unlock for 5 seconds and then automatically re-lock
        async function autoUnlockFiveSeconds() {
            if (isUpdating) return;
            vibratePhone([40]);

            const autoBtnText = document.getElementById("autoUnlockBtnText");
            isUpdating = true;
            autoBtnText.innerHTML = '<span class="spinner"></span> Unlocking...';

            try {
                // 1. Send Unlock command (1 = Unlocked)
                const unlockRes = await fetch(`https://blynk.cloud/external/api/update?token=${BLYNK_AUTH_TOKEN}&${PIN}=1`);
                if (!unlockRes.ok) throw new Error("Unlock failed");

                isLocked = false;
                updateUI();
                vibratePhone([30, 40]);
                showToast("Door unlocked! Auto-relocking in 5s...", "🔓");

                // 2. Countdown 5 seconds
                let timeLeft = 5;
                if (countdownTimer) clearInterval(countdownTimer);

                countdownTimer = setInterval(async () => {
                    timeLeft--;
                    if (timeLeft > 0) {
                        autoBtnText.innerText = `Auto-relocking in ${timeLeft}s...`;
                    } else {
                        clearInterval(countdownTimer);
                        autoBtnText.innerHTML = '<span class="spinner"></span> Relocking...';

                        try {
                            // 3. Send Lock command (0 = Locked)
                            await fetch(`https://blynk.cloud/external/api/update?token=${BLYNK_AUTH_TOKEN}&${PIN}=0`);
                            isLocked = true;
                            updateUI();
                            vibratePhone([40]);
                            showToast("Door securely re-locked", "🔒");
                        } catch (e) {
                            showToast("Auto-relock failed! Please lock manually.", "⚠️");
                        } finally {
                            autoBtnText.innerText = "Temporary 5s Auto-Unlock";
                            isUpdating = false;
                        }
                    }
                }, 1000);

            } catch (err) {
                console.error("autoUnlock error:", err);
                showToast("Failed to unlock. Check connection.", "⚠️");
                autoBtnText.innerText = "Temporary 5s Auto-Unlock";
                isUpdating = false;
                updateUI();
            }
        }

        // Test connection / Ping
        async function testConnection() {
            vibratePhone([20]);
            showToast("Pinging Blynk Cloud...", "📶");
            const t0 = performance.now();
            try {
                const res = await fetch(`https://blynk.cloud/external/api/isHardwareConnected?token=${BLYNK_AUTH_TOKEN}`);
                const latency = Math.round(performance.now() - t0);
                if (res.ok) {
                    showToast(`Blynk Cloud reached in ${latency}ms`, "⚡");
                    checkHardwareStatus();
                } else {
                    showToast("Blynk response error", "⚠️");
                }
            } catch (e) {
                showToast("Network unreachable", "❌");
            }
        }

        // Fetch recent intruder/visitor alert photo from Blynk V2
        async function checkPhotoAlert() {
            try {
                const response = await fetch(`https://blynk.cloud/external/api/get?token=${BLYNK_AUTH_TOKEN}&${PHOTO_PIN}`);
                if (response.ok) {
                    const raw = (await response.text()).trim();
                    const photoUrl = raw.replace(/[\[\]"']/g, '').trim();
                    // Valid URL format
                    if (photoUrl && photoUrl.startsWith("http") && photoUrl !== "0" && photoUrl !== alertDismissedFor) {
                        if (photoUrl !== lastKnownPhoto) {
                            lastKnownPhoto = photoUrl;
                            showPhotoAlert(photoUrl);
                        }
                    }
                }
            } catch (e) {
                // Silently handle if datastream is not yet created or offline
            }
        }

        // Display photo alert in UI
        function showPhotoAlert(url, timeStr = null) {
            const card = document.getElementById("visitorAlertCard");
            const img = document.getElementById("intruderPhotoImg");
            const timeEl = document.getElementById("alertTimestamp");

            img.src = url;
            const now = new Date();
            timeEl.innerText = timeStr || now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            card.style.display = "flex";
            vibratePhone([60, 40, 60]);
        }

        // Dismiss the alert card
        function dismissPhotoAlert() {
            const card = document.getElementById("visitorAlertCard");
            card.style.display = "none";
            alertDismissedFor = lastKnownPhoto;
            showToast("Alert dismissed", "ℹ️");
        }

        // Open full-screen photo modal
        function openPhotoModal() {
            const modal = document.getElementById("photoModal");
            const modalImg = document.getElementById("modalImg");
            const currentSrc = document.getElementById("intruderPhotoImg").src;
            if (currentSrc) {
                modalImg.src = currentSrc;
                modal.classList.add("open");
            }
        }

        // Close full-screen photo modal
        function closePhotoModal() {
            const modal = document.getElementById("photoModal");
            if (modal) modal.classList.remove("open");
        }

        // Demo preview simulation
        function simulateAlertDemo() {
            showPhotoAlert("https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=600&auto=format&fit=crop&q=80");
            showToast("Demo alert displayed", "📸");
        }

        // Update UI elements based on current lock state
        function updateUI() {
            const container = document.getElementById("cardContainer");
            const btnIcon = document.getElementById("btnIcon");
            const btnText = document.getElementById("btnText");
            const btnSub = document.getElementById("btnSub");
            const statusHeading = document.getElementById("statusHeading");

            if (isLocked) {
                container.className = "card state-locked";
                btnIcon.innerText = "🔒";
                btnText.innerText = "LOCKED";
                btnSub.innerText = "Tap to unlock";
                statusHeading.innerText = "Door is Securely Locked";
            } else {
                container.className = "card state-unlocked";
                btnIcon.innerText = "🔓";
                btnText.innerText = "UNLOCKED";
                btnSub.innerText = "Tap to lock";
                statusHeading.innerText = "Door is Unlocked";
            }
        }

        // Initialize and start background polling
        fetchStatus();
        setInterval(fetchStatus, 3500);
    </script>
</body>

</html>
